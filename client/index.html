    <!--

      are ALL injected server-side by server/seo.ts for every route.
      Do NOT add them here — they will create duplicate tags that hurt SEO.
      The seoMiddleware strips and re-injects them with per-page values.
    -->

    <!-- OG image dimensions (safe to keep — not duplicated by seo.ts) -->

    <meta property="og:image:width" content="1200" />

    <!-- Preconnect: third-party origins hit on every page load -->
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://www.google-analytics.com" />
    <link rel="preconnect" href="https://analytics.quantumsurety.bond" />

    <!-- Google Analytics 4 -->

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-QGDQ6JDMMH', {
        page_title: document.title,
        page_location: window.location.href,
        send_page_view: true
      });
    </script>

    <!-- Matomo -->
    <script>
      var _paq = window._paq = window._paq || [];
      _paq.push(['trackPageView']);
      _paq.push(['enableLinkTracking']);
      (function() {
        var u="//analytics.quantumsurety.bond/";
        _paq.push(['setTrackerUrl', u+'matomo.php']);
        _paq.push(['setSiteId', '1']);
        var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
        g.async=true; g.src=u+'matomo.js'; s.parentNode.insertBefore(g,s);
      })();
